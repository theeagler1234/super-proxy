services:
  ubuntu-desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: ubuntu-desktop
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      CUSTOM_USER: ubuntu
      PASSWORD: change-this-password
      TITLE: Ubuntu Codespace Desktop
    network_mode: host
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - ./ubuntu-desktop-config:/config
    shm_size: "1gb"
    mem_limit: 12g
    restart: unless-stopped
